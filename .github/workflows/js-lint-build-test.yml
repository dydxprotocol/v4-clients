name: "[v4-client-js] Lint, Build, & Test"
on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'v4-client-js/**'
      - '.github/workflows/js-lint-build-test.yml'
      - '.github/workflows/js-publish.yml'
      - '.github/workflows/commitlint.yml'
  push:
    paths:
      - 'v4-client-js/**'
      - '.github/workflows/js-lint-build-test.yml'
      - '.github/workflows/js-publish.yml'
      - '.github/workflows/commitlint.yml'
    branches:
      - main
      - "release/*"

jobs:
  CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v4-client-js
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: 'v4-client-js/.nvmrc'
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: '**/package-lock.json'

      - name: Record Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_READ }}

      - name: Run eslint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check publish package
        run: npm pack --dry-run
